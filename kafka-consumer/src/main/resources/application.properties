spring.application.name=kafka-consumer
server.port=8081

spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=my-group-2
spring.kafka.consumer.auto-offset-reset=earliest

# STRING Deserializer for Consumer Value
spring.kafka.consumer.string.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.string.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# JSON Deserializer for Consumer Value
spring.kafka.consumer.json.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.json.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# TOPIC Names
kafka.string.topic.name=topic_string
kafka.json.topic.name=topic_json